# Engineering wiki sync — MANAGED by eng-wiki-standards.
#
# Every push to main opens (or updates) a pull request on eng-wiki-standards that appends the pull
# requests merged since the last sync to projects/<project>/CHANGELOG.md. The project's wiki folder
# therefore always records what shipped, without anyone remembering to write it.
#
# This keeps the record complete. It does not replace the human/agent step in AIAGENTS.md: when a
# change alters documented behaviour, the author also opens a docs(<project>): PR correcting the page
# that is now wrong. A changelog line is not a corrected page.
#
# Needs:  ENG_WIKI_PROJECT in .axelliant/standards.env, and the organisation secret ENG_WIKI_TOKEN —
#         a fine-grained token with Contents and Pull requests write on eng-wiki-standards. (The
#         default GITHUB_TOKEN cannot write to another repository.)
# Without either, the job writes a warning to its summary and succeeds: it never blocks a release.
name: Engineering wiki sync

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-wiki-sync
  cancel-in-progress: false

jobs:
  # Self-hosted when an Axelliant runner is online and idle, GitHub-hosted otherwise
  # (runner-select.yml says why this is a probe, not a fallback).
  runner:
    uses: ./.github/workflows/runner-select.yml
    # Only the probe token, not `secrets: inherit`: the called workflow gets nothing it does not use.
    secrets:
      AXELLIANT_RUNNER_PROBE_TOKEN: ${{ secrets.AXELLIANT_RUNNER_PROBE_TOKEN }}

  sync:
    if: ${{ !cancelled() }}
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read project name
        id: cfg
        run: |
          project="$(sed -n 's/^ENG_WIKI_PROJECT=//p' .axelliant/standards.env 2>/dev/null | tr -d '"'"'"' ' | head -1)"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Open or update the wiki changelog PR
        env:
          GH_TOKEN: ${{ secrets.ENG_WIKI_TOKEN }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          WIKI_REPO: axelliantsoftwareteam/eng-wiki-standards
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::eng-wiki-sync skipped: set ENG_WIKI_PROJECT in .axelliant/standards.env and the ENG_WIKI_TOKEN organisation secret."
            { echo "### Engineering wiki sync skipped"; echo "ENG_WIKI_PROJECT='${PROJECT}', ENG_WIKI_TOKEN set: $([ -n "$GH_TOKEN" ] && echo yes || echo no)"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config --global user.name "axelliant-wiki-sync"
          git config --global user.email "engineering@axelliant.com"
          gh repo clone "$WIKI_REPO" wiki -- --depth 50 --branch uat 2>/dev/null || gh repo clone "$WIKI_REPO" wiki -- --depth 50
          changelog="wiki/projects/$PROJECT/CHANGELOG.md"
          mkdir -p "$(dirname "$changelog")"
          [ -f "$changelog" ] || printf '# %s — changelog\n\nAppended automatically on every push to main by eng-wiki-sync.\n' "$PROJECT" > "$changelog"
          # From the last synced commit; on the first run (or if that commit is gone after a history
          # rewrite), just this push's range — never the whole history.
          last="$(grep -o 'sync-commit: [0-9a-f]\{40\}' "$changelog" | tail -1 | cut -d' ' -f2 || true)"
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null; then range="$last..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="HEAD~1..HEAD"; fi
          entries="$(git log --first-parent --format='- %s (%h, %an)' "$range" | head -100)"
          [ -n "$entries" ] || { echo "Nothing new since $last."; exit 0; }
          {
            echo
            echo "## $(date -u +%Y-%m-%d) — ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            echo
            echo "$entries"
            echo
            echo "<!-- sync-commit: ${GITHUB_SHA} -->"
          } >> "$changelog"
          branch="docs/${PROJECT}-changelog-sync"
          cd wiki
          base="$(git rev-parse --abbrev-ref HEAD)"
          git checkout -B "$branch"
          git add "projects/$PROJECT/CHANGELOG.md"
          git commit -m "docs(${PROJECT}): sync changelog from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" -m "Refs: none"
          git push --force-with-lease origin "$branch"
          body="$(printf '## Summary\n\nAutomatic changelog sync for **%s** from %s at %s.\n\n## Ticket\n\nNone — automated sync.\n\n## Tests\n\nNone — documentation only.\n\n## Checklist\n\n- [x] Documentation only\n' "$PROJECT" "$GITHUB_REPOSITORY" "${GITHUB_SHA::7}")"
          if gh pr view "$branch" --repo "$WIKI_REPO" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Updated the open changelog PR."
          else
            gh pr create --repo "$WIKI_REPO" --base "$base" --head "$branch" \
              --title "docs(${PROJECT}): sync changelog from main" --body "$body"
          fi
