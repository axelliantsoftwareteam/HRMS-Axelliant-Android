# Android CI — adapted from eng-wiki-standards (templates/stacks/android); owned by this repository.
# Runs .axelliant/local-checks.sh (the same checks as a laptop: Android lint, unit tests, debug
# build) and reports one always-present `axelliant-gate` context for branch protection.
name: Android CI

on:
  pull_request:
  push:
    branches: [main, uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Lint, unit tests, debug build
        run: ./.axelliant/local-checks.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn

  axelliant-gate:
    # The single required context. Always runs; fails if any needed job failed or was cancelled.
    if: always()
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c 'import json,sys; bad=[k for k,v in json.load(sys.stdin).items() if v["result"] in ("failure","cancelled")]; print("failed:",bad) if bad else print("all good"); sys.exit(1 if bad else 0)'
