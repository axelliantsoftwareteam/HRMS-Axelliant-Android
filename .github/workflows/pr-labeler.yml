# PR labeler — MANAGED by eng-wiki-standards. Do not edit here; change it upstream and re-sync.
#
# Every pull request is labelled automatically with what it is (type, from the title), what it
# touches (area, from paths in .github/pr-labels.json), how big it is (size) and whether it breaks
# anything. Labels drive the generated release notes (.github/release.yml) and review routing — they
# are data, not decoration. Automatic labelling is mandatory in every Axelliant repository.
#
# Deliberately NOT a required status check: a required check the author cannot satisfy (only this job
# can apply the label) would wedge PRs for no safety benefit. If it fails, fix the workflow.
#
# Does not use actions/labeler, which errors when a configured label does not exist yet: this job
# creates missing labels from .github/pr-labels.json, so adding an area never breaks a pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Self-hosted when an Axelliant runner is online and idle, GitHub-hosted otherwise
  # (runner-select.yml says why this is a probe, not a fallback).
  runner:
    uses: ./.github/workflows/runner-select.yml
    # Only the probe token, not `secrets: inherit`: the called workflow gets nothing it does not use.
    secrets:
      AXELLIANT_RUNNER_PROBE_TOKEN: ${{ secrets.AXELLIANT_RUNNER_PROBE_TOKEN }}

  label:
    needs: runner
    # Fork pull requests get a read-only token, so labelling cannot work there.
    # Skipping is correct; failing would be noise on a contribution we invited.
    if: ${{ !cancelled() && (github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      # No checkout on purpose: the config is read over the API, which touches no runner workspace
      # (a sparse checkout on a shared self-hosted runner once poisoned later jobs) and is faster.
      - name: Apply type, area, size and breaking-change labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const configFile = await github.rest.repos.getContent({
              owner, repo, path: '.github/pr-labels.json', ref: pr.head.sha,
            });
            const cfg = JSON.parse(
              Buffer.from(configFile.data.content, 'base64').toString('utf8'),
            );

            // ---- type, from the title -------------------------------------
            // lint-pr-metadata already guarantees `type(scope): summary`, so the
            // title is reliable structured data and needs no second parser.
            const titleMatch = /^([a-z]+)(\([^)]*\))?(!)?:/.exec(pr.title || '');
            const wanted = new Set();

            if (titleMatch && cfg.types[titleMatch[1]]) {
              wanted.add(cfg.types[titleMatch[1]]);
            }

            // ---- breaking change ------------------------------------------
            const body = pr.body || '';
            if ((titleMatch && titleMatch[3]) || /^BREAKING[ -]CHANGE:/m.test(body)) {
              wanted.add(cfg.breaking);
            }

            // ---- area, from the changed paths ------------------------------
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const paths = files.map(f => f.filename);

            // Pattern shapes: `prefix/**`, `**/*.ext`, `**/name/**` and exact paths.
            const matches = (path, pattern) => {
              // Case-insensitive on extension: AIAGENTS.MD and README.md are both docs.
              if (pattern.startsWith('**/*.')) {
                return path.toLowerCase().endsWith(pattern.slice(4).toLowerCase());
              }
              if (pattern.startsWith('**/') && pattern.endsWith('/**')) return ('/' + path).includes('/' + pattern.slice(3, -2));
              if (pattern.endsWith('/**')) return path.startsWith(pattern.slice(0, -2));
              return path === pattern;
            };

            for (const area of cfg.areas) {
              if (paths.some(p => area.paths.some(pat => matches(p, pat)))) {
                wanted.add(area.label);
              }
            }

            // ---- size, from the diff ---------------------------------------
            // Generated and vendored files are excluded: a regenerated lockfile or
            // schema contract says nothing about how much there is to review.
            const reviewable = files.filter(
              f => !cfg.sizeIgnore.some(pat => matches(f.filename, pat)),
            );
            const churn = reviewable.reduce((n, f) => n + f.additions + f.deletions, 0);
            const size = cfg.sizes.find(s => churn <= s.upTo) || cfg.sizes[cfg.sizes.length - 1];
            wanted.add(size.label);

            // ---- make sure every label exists ------------------------------
            const defs = cfg.definitions;
            for (const name of wanted) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                const def = defs[name] || {};
                await github.rest.issues.createLabel({
                  owner, repo, name,
                  color: def.color || 'ededed',
                  description: def.description || '',
                });
                core.info(`Created missing label '${name}'.`);
              }
            }

            // ---- apply, and drop managed labels that no longer apply --------
            // Only labels this workflow owns are removed. A label a human added by
            // hand is theirs and is left alone.
            const managed = new Set(Object.keys(defs));
            const current = pr.labels.map(l => l.name);

            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name,
                });
              }
            }

            const toAdd = [...wanted].filter(n => !current.includes(n));
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: toAdd,
              });
            }

            core.info(`Labels: ${[...wanted].join(', ') || '(none)'}`);
            await core.summary
              .addHeading('PR labels', 3)
              .addRaw(`${[...wanted].map(l => `\`${l}\``).join(' · ') || '_none_'}`)
              .addRaw(`\n\nReviewable churn: ${churn} lines across ${reviewable.length} files.`)
              .write();
