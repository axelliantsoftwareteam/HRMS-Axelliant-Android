# Standards update — MANAGED by eng-wiki-standards.
#
# Weekly, checks whether a newer release of the engineering standards exists and, if so, opens a PR
# running scripts/sync-standards.sh at that release. Keeps every repository on the same rules without
# anyone remembering to look.
#
# Uses the organisation secret STANDARDS_BOT_TOKEN when present (PRs opened with the default
# GITHUB_TOKEN do not trigger other workflows, so their checks would never run); falls back to
# GITHUB_TOKEN so the PR is at least opened.
name: Standards update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Self-hosted when an Axelliant runner is online and idle, GitHub-hosted otherwise
  # (runner-select.yml says why this is a probe, not a fallback).
  runner:
    uses: ./.github/workflows/runner-select.yml
    # Only the probe token, not `secrets: inherit`: the called workflow gets nothing it does not use.
    secrets:
      AXELLIANT_RUNNER_PROBE_TOKEN: ${{ secrets.AXELLIANT_RUNNER_PROBE_TOKEN }}

  update:
    if: ${{ !cancelled() }}
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: uat
          token: ${{ secrets.STANDARDS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sync to the latest standards release
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          current="$(sed -n 's/^# ref: //p' .axelliant/standards.lock 2>/dev/null)"
          latest="$(git ls-remote --tags --sort=-v:refname https://github.com/axelliantsoftwareteam/eng-wiki-standards.git 'v*' | sed -n '1s#.*refs/tags/##p' | sed 's/\^{}//')"
          if [ -z "$latest" ] || [ "$current" = "$latest" ]; then echo "Standards up to date (${current:-none})."; exit 0; fi
          ./scripts/sync-standards.sh --ref "$latest"
          if git diff --quiet; then echo "No changes."; exit 0; fi
          branch="chore/standards-${latest}"
          git config user.name "axelliant-standards-bot"
          git config user.email "engineering@axelliant.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: sync axelliant engineering standards ${latest}" -m "Refs: none"
          git push --force-with-lease origin "$branch"
          body="$(printf '## Summary\n\nSyncs the Axelliant engineering standards from %s to %s. Managed files only; repository-owned files are untouched.\n\nRelease notes: https://github.com/axelliantsoftwareteam/eng-wiki-standards/releases/tag/%s\n\n## Ticket\n\nNone — automated standards sync.\n\n## API / Endpoint Changes\n\nNone\n\n## Data Model Changes\n\nNone\n\n## Tests\n\n- **Success path:** CI runs every gate at the new version.\n- **Edge cases:** None\n- **Failure modes:** A new gate may fail on existing code; fix it or baseline it deliberately in a follow-up.\n- **Boundaries:** None\n\n## Risk & Rollout\n\nMerge into uat; promote as normal.\n' "${current:-none}" "$latest" "$latest")"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base uat --head "$branch" --title "chore: sync axelliant engineering standards ${latest}" --body "$body"
