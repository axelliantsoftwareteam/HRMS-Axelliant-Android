# SAST — seeded by eng-wiki-standards; owned here.
# Static analysis for security defects on every PR, every push to uat/main, and weekly (rule updates
# find old bugs). Semgrep, open source: the OWASP Top 10 and CWE Top 25 rulesets over every tracked
# file, with ERROR findings blocking the merge. No GitHub Code Security subscription is needed.
#
# A false positive is suppressed next to the code with `# nosemgrep: <rule-id>` (or `// nosemgrep`)
# and a comment saying why it is safe. Never widen the excludes to make a finding go away.
# Adopted from gruhnguitar's security-check.
name: SAST

on:
  pull_request:
  push:
    branches: [main, master, uat]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted when an Axelliant runner is online and idle, GitHub-hosted otherwise
  # (runner-select.yml says why this is a probe, not a fallback).
  runner:
    uses: ./.github/workflows/runner-select.yml
    # Only the probe token, not `secrets: inherit`: the called workflow gets nothing it does not use.
    secrets:
      AXELLIANT_RUNNER_PROBE_TOKEN: ${{ secrets.AXELLIANT_RUNNER_PROBE_TOKEN }}

  sast:
    if: ${{ !cancelled() }}
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Semgrep (OWASP Top 10, CWE Top 25; errors block)
        run: |
          python -m pip install --quiet semgrep==1.155.0
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/cwe-top-25 --severity ERROR --error \
            --exclude node_modules --exclude bin --exclude obj --exclude dist --exclude build \
            --exclude coverage --exclude .next --exclude Migrations --exclude migrations .
      - name: Warnings (advisory)
        if: always()
        run: |
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/cwe-top-25 --severity WARNING \
            --exclude node_modules --exclude bin --exclude obj --exclude dist --exclude build \
            --exclude coverage --exclude .next --exclude Migrations --exclude migrations . || true
